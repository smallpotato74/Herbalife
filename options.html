<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>期權篩選 Dashboard</title>
<style>
  :root{
    --bg:#0f1419; --card:#1a212b; --card2:#232c38; --line:#2d3845;
    --txt:#e6edf3; --dim:#8b97a6; --buy:#2ea043; --sell:#e3873c;
    --call:#2f81f7; --put:#bc4cff; --warn:#f0883e; --good:#3fb950;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
    -webkit-text-size-adjust:100%;}
  header{position:sticky;top:0;z-index:5;background:rgba(15,20,25,.95);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
    padding:14px 16px;}
  h1{margin:0;font-size:18px;display:flex;align-items:center;gap:8px}
  .meta{font-size:12px;color:var(--dim);margin-top:4px;display:flex;
    flex-wrap:wrap;gap:6px 14px;align-items:center}
  .src{padding:1px 8px;border-radius:20px;font-weight:700;font-size:11px}
  .src.LIVE{background:#10331c;color:var(--good)}
  .src.DEMO\(合成數據\),.src.demo{background:#3a2a12;color:var(--warn)}
  .wrap{max-width:840px;margin:0 auto;padding:14px}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .chip{border:1px solid var(--line);background:var(--card);color:var(--dim);
    padding:6px 12px;border-radius:20px;font-size:13px;cursor:pointer}
  .chip.on{color:#fff;border-color:transparent}
  .chip.on[data-f="ALL"]{background:#39424f;color:#fff}
  .chip.on[data-f="BUY"]{background:var(--buy)}
  .chip.on[data-f="SELL"]{background:var(--sell)}

  .tk{background:var(--card);border:1px solid var(--line);border-radius:14px;
    margin-bottom:16px;overflow:hidden}
  .tk-head{padding:14px 16px;display:flex;align-items:center;
    justify-content:space-between;gap:10px;cursor:pointer}
  .tk-name{font-size:20px;font-weight:800;letter-spacing:.5px}
  .tk-spot{font-size:13px;color:var(--dim);margin-top:3px}
  .badge{padding:4px 12px;border-radius:8px;font-weight:800;font-size:13px}
  .badge.BUY{background:var(--buy);color:#fff}
  .badge.SELL{background:var(--sell);color:#fff}
  .badge.NEUTRAL{background:#39424f;color:#fff}
  .stat{display:flex;flex-wrap:wrap;gap:6px 16px;padding:0 16px 12px;
    font-size:12px;color:var(--dim)}
  .stat b{color:var(--txt);font-weight:600}
  .er{color:var(--warn)}

  .picks{border-top:1px solid var(--line)}
  .pick{padding:12px 16px;border-bottom:1px solid var(--line)}
  .pick:last-child{border-bottom:none}
  .pr1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .ptype{font-weight:800;font-size:12px;padding:2px 8px;border-radius:6px}
  .ptype.CALL{background:#11243f;color:var(--call)}
  .ptype.PUT{background:#2a1440;color:var(--put)}
  .pk{font-weight:700;font-size:15px}
  .pexp{font-size:12px;color:var(--dim)}
  .score{margin-left:auto;display:flex;align-items:center;gap:8px}
  .bar{width:70px;height:7px;border-radius:4px;background:#0c1117;overflow:hidden}
  .bar>i{display:block;height:100%}
  .sval{font-weight:800;font-size:14px;min-width:34px;text-align:right}
  .greeks{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:7px;
    font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
  .greeks b{color:var(--txt);font-weight:600}
  .why{margin-top:7px;font-size:11.5px;color:var(--dim);display:none}
  .why.show{display:block}
  .why div{padding:2px 0}
  .togg{font-size:11px;color:var(--call);cursor:pointer;margin-top:6px;
    display:inline-block}
  .exit{margin:6px 16px 14px;padding:10px 12px;background:var(--card2);
    border-radius:10px;font-size:12px;color:var(--dim);line-height:1.6}
  .exit b{color:var(--txt)}
  .empty{padding:18px 16px;color:var(--dim);font-size:13px}
  footer{max-width:840px;margin:0 auto;padding:18px 16px 40px;
    font-size:11px;color:var(--dim);line-height:1.7}
  .err{background:#3a1518;border:1px solid #5c2327;color:#ffb4ba;
    padding:14px;border-radius:12px;font-size:13px;line-height:1.7}
  code{background:#0c1117;padding:1px 6px;border-radius:5px;font-size:12px}
  .refresh{background:none;border:1px solid var(--line);color:var(--dim);
    border-radius:8px;padding:4px 10px;font-size:12px;cursor:pointer}
</style>
</head>
<body>
<header>
  <h1>📈 期權篩選 Dashboard</h1>
  <div class="meta" id="meta">載入緊…</div>
</header>

<div class="wrap">
  <div class="filters" id="filters" style="display:none">
    <div class="chip on" data-f="ALL">全部</div>
    <div class="chip" data-f="BUY">只睇 BUY</div>
    <div class="chip" data-f="SELL">只睇 SELL</div>
  </div>
  <div id="app"></div>
</div>

<footer>
  ⚠️ 教育用途,非投資建議。期權高風險,落場前用模擬倉。<br>
  數據由 <code>options_screener.py</code> 生成 → <code>options_data.json</code>。
  方向:IV/HV&lt;1.0 偏 BUY、&gt;1.2 偏 SELL。分數滿分 100(流動性+Delta+到價+IV regime)。
</footer>

<!-- 本地 file:// 開都讀到(fetch 失敗時 fallback) -->
<script src="options_data.js" onerror="window.__noJS=1"></script>
<script>
const EXIT = {
  BUY:"<b>買方退場</b>：賺 +50~100% 止賺 / 蝕 −40~50% 止蝕 / 到 21 DTE 未 work 就重評換月。",
  SELL:"<b>賣方退場</b>：收到 50% premium 止賺 / 蝕到 2× credit 止蝕 / 到 21 DTE 管理避 gamma。⚠️ 裸 short call 風險無限,用 spread。",
  NEUTRAL:"中性:考慮觀望或用 spread / iron condor。"
};
const fmtPct = x => x==null ? "—" : (x*100).toFixed(1)+"%";
const scoreColor = s => s>=80?"#3fb950":s>=60?"#d29922":s>=40?"#db6d28":"#f85149";

function render(data){
  const m = document.getElementById('meta');
  m.innerHTML = `<span class="src ${(data.source||'').includes('LIVE')?'LIVE':'demo'}">${data.source||'?'}</span>`
    + `更新:${data.generated_at||'—'}`
    + ` · DTE ${data.config?.min_dte}-${data.config?.max_dte}`
    + ` · <button class="refresh" onclick="location.reload()">↻ 重新整理</button>`;
  document.getElementById('filters').style.display='flex';

  const app = document.getElementById('app');
  app.innerHTML = '';
  (data.results||[]).forEach(r=>{
    const tk = document.createElement('div');
    tk.className='tk'; tk.dataset.side=r.side;
    const er = r.earnings ? `<span class="er">⚠️ earnings ${r.earnings}</span>` : '';
    const ivhv = r.iv_hv==null?'—':r.iv_hv.toFixed(2);
    let picks = (r.picks||[]).map((p,i)=>{
      const reasons = (p.reasons||[]).map(x=>`<div>• ${x}</div>`).join('');
      return `<div class="pick">
        <div class="pr1">
          <span class="ptype ${p.type}">${p.type}</span>
          <span class="pk">${p.strike}</span>
          <span class="pexp">${p.expiry} · ${p.dte}d</span>
          <span class="score">
            <span class="bar"><i style="width:${Math.max(4,p.score)}%;background:${scoreColor(p.score)}"></i></span>
            <span class="sval" style="color:${scoreColor(p.score)}">${p.score}</span>
          </span>
        </div>
        <div class="greeks">
          <span>mid <b>$${p.mid}</b></span>
          <span>IV <b>${fmtPct(p.iv)}</b></span>
          <span>Δ <b>${p.delta>=0?'+':''}${p.delta}</b></span>
          <span>Γ <b>${p.gamma}</b></span>
          <span>θ/日 <b>$${p.theta}</b></span>
          <span>vega <b>$${p.vega}</b></span>
          <span>OI <b>${p.oi}</b></span>
        </div>
        <span class="togg" onclick="this.nextElementSibling.classList.toggle('show')">▾ 點解揀佢</span>
        <div class="why">${reasons}</div>
      </div>`;
    }).join('');
    if(!picks) picks = `<div class="empty">冇合條件嘅候選(流動性/DTE/Delta 過濾後)。</div>`;

    tk.innerHTML = `
      <div class="tk-head">
        <div>
          <div class="tk-name">${r.ticker}</div>
          <div class="tk-spot">$${r.spot} · ATR ${r.atr??'—'} · HV20 ${fmtPct(r.hv20)} · HVR ${r.hv_rank??'—'}</div>
        </div>
        <span class="badge ${r.side}">${r.side}</span>
      </div>
      <div class="stat">
        <span>ATM-IV <b>${fmtPct(r.atm_iv)}</b></span>
        <span>IV/HV <b>${ivhv}</b></span>
        ${er}
      </div>
      <div class="exit">${EXIT[r.side]||''}</div>
      <div class="picks">${picks}</div>`;
    app.appendChild(tk);
  });

  document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
    document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));
    c.classList.add('on');
    const f=c.dataset.f;
    document.querySelectorAll('.tk').forEach(tk=>{
      tk.style.display = (f==='ALL'||tk.dataset.side===f)?'':'none';
    });
  });
}

function showError(){
  document.getElementById('meta').textContent='';
  document.getElementById('app').innerHTML =
    `<div class="err"><b>讀唔到數據</b><br>
     先跑:<code>python options_screener.py --demo --tickers AAPL NVDA KO SPY --json options_data.json</code><br>
     再用 GitHub Pages(https) 開呢頁;或本地用 <code>python -m http.server</code> 開,
     <code>options_data.js</code> 亦會自動 fallback。</div>`;
}

// 1) 試 fetch JSON(GitHub Pages / http server 正路)
fetch('options_data.json?v='+Date.now())
  .then(r=>{ if(!r.ok) throw 0; return r.json(); })
  .then(render)
  // 2) fetch 失敗(file://) → 用 options_data.js 注入嘅全域變數
  .catch(()=> window.OPTIONS_DATA ? render(window.OPTIONS_DATA) : showError());
</script>
</body>
</html>
